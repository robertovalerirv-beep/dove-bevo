# PR checks (SPEC 16). Every job must be green to merge into main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push cancels the CI of a pull request, but never a run on main: the deploy starts only when the CI of
# main ends green, and with pushes closer than one CI run every merge was cancelled and none was deployed. On main
# the group keeps one run going and one waiting (a newer push replaces the waiting one). Since a run on main is
# never cancelled, every job has a time limit: a job stuck on the network (apt, browsers) would otherwise hold the
# queue, and the deploy, for GitHub's default of 6 hours. The limits are about twice the usual duration.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  checks:
    name: Lint, typecheck, unit, guards, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the feature list guard reads the spec-approved-16 tag
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - name: European catalogue identity and serving source guards
        run: python3 -B -m unittest discover -s mobile-apps/tools/europe-catalogue -p 'test_*.py' -q
      - name: Guarded European menu transactions
        run: python3 -B -m unittest discover -s mobile-apps/tools/europe-menu-import -p 'test_*.py' -q
      - run: node scripts/check-feature-list.mjs
      - run: node scripts/check-workflows.mjs
      - run: node scripts/check-config.mjs
      - run: npm audit --audit-level=high
      # What runs in the Worker and the browser: any advisory, whatever its severity.
      - run: npm audit --omit=dev --audit-level=low

  e2e:
    name: E2E (Chromium, WebKit) and security tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Temporary (11/11/2026): Canonical's nameservers (ns*.canonical.com) do not answer, so *.ubuntu.com does not
      # resolve and apt fails. The runner's mirror list holds only the kernel.org Ubuntu mirror (a line without a
      # priority would be tried last); apt still checks every index against the Ubuntu archive key. Remove once
      # ubuntu.com resolves again.
      - name: Ubuntu mirror outside ubuntu.com (temporary)
        run: echo 'https://mirrors.edge.kernel.org/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt
      - run: npx playwright install --with-deps chromium webkit
      - name: App presentation interaction regressions
        run: node --test mobile-apps/presentation/tests/*.test.mjs
      # All Playwright projects (chromium, webkit, security) share one build and server.
      - run: npx playwright test
      - name: App-only mobile presentation and routing
        run: |
          npx tsc -p mobile-apps/web/tsconfig.json --noEmit
          node --test mobile-apps/web/tests/*.test.mjs mobile-apps/web/components/tests/components.test.mjs

  osm-import:
    name: OSM import on a test PBF
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Temporary (11/11/2026): Canonical's nameservers (ns*.canonical.com) do not answer, so *.ubuntu.com does not
      # resolve and apt fails. The runner's mirror list holds only the kernel.org Ubuntu mirror (a line without a
      # priority would be tried last); apt still checks every index against the Ubuntu archive key. Remove once
      # ubuntu.com resolves again.
      - name: Ubuntu mirror outside ubuntu.com (temporary)
        run: echo 'https://mirrors.edge.kernel.org/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt
      - run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - run: osmium cat tests/fixtures/osm/sample.osm -o "$RUNNER_TEMP/sample.osm.pbf"
      - run: scripts/osm-import/import.sh "$RUNNER_TEMP/sample.osm.pbf" "$RUNNER_TEMP/data" fixture
      - name: Output matches the expected cell
        run: node scripts/osm-import/compare-cell.mjs "$RUNNER_TEMP/data/fixture/v/u0nd9.json" tests/fixtures/osm/expected-u0nd9.json

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-bundle-size.mjs
      # Not in the lockfile: its transitive dependencies fail npm audit (ADR 0009).
      - name: Lighthouse (median of 3 runs)
        run: |
          status=0
          npx --yes @lhci/cli@0.15.1 autorun || status=$?
          node scripts/lighthouse-summary.mjs
          exit $status

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
