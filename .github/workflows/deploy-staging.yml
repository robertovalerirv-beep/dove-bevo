# Deploy to staging after a green CI run on main (SPEC 16). `staging` is the live environment (ADR 0036): a tag v0.x.y only marks a release on main.
name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    # Only CI runs triggered by a push to main of this repository (never forks or PRs).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 75 # a stuck step must fail, not hold the deploy queue for hours
    env:
      WRANGLER_SEND_METRICS: "false"
      PBF_URL: https://download.geofabrik.de/europe/italy-latest.osm.pbf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # OSM import (SPEC 5.3, D-03): the deploy never waits for Geofabrik. It restores the newest
      # extract from the Actions cache, which refresh-osm-extract.yml fills every day (ADR 0051).
      # A failed import fails the deploy.
      # Canonical DNS has been unreliable. Keep signed Ubuntu archive checks and give APT independent HTTPS mirrors
      # with explicit failover order; the kernel.org mirror alone timed out before the import could start.
      - name: Ubuntu archive mirrors with failover
        run: printf '%s\tpriority:%s\n' 'https://mirrors.edge.kernel.org/ubuntu' 1 'https://mirrors.ocf.berkeley.edu/ubuntu' 2 'https://mirrors.mit.edu/ubuntu' 3 | sudo tee /etc/apt/apt-mirrors.txt
      - run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - name: Restore the newest OSM extract
        id: pbf
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/italy.osm.pbf
          key: osm-italy-never-an-exact-match # only the prefix below can match: the newest entry wins
          restore-keys: osm-italy-
      # Last resort, only if the cache holds no extract at all (evicted): a bounded download.
      # Measured on a cache miss: 4 min and 26 min on 20/11/2026, 40+ min without end on 23/11.
      # Slow is allowed (50 min); a stalled connection (under 300 KB/s for 60 s) is dropped and
      # resumed from the same byte (-C -).
      - name: Download the extract (only if the cache held none)
        timeout-minutes: 50
        env:
          MATCHED: ${{ steps.pbf.outputs.cache-matched-key }}
        run: |
          # Only keys written by refresh-osm-extract.yml are accepted (osm-italy- and 12 digits).
          if [ -n "$MATCHED" ] && ! [[ "$MATCHED" =~ ^osm-italy-[0-9]{12}$ ]]; then
            echo "Unexpected cache key: $MATCHED"; exit 1
          fi
          echo "Cached extract: '$MATCHED'"
          test -f "$RUNNER_TEMP/italy.osm.pbf" || curl -fsSL -C - \
            --connect-timeout 30 --speed-limit 300000 --speed-time 60 \
            --retry 10 --retry-all-errors --retry-delay 5 \
            -o "$RUNNER_TEMP/italy.osm.pbf" "$PBF_URL"
      - name: OSM import
        id: import
        run: |
          set -o pipefail # a failed import must fail the deploy (SPEC 5.3)
          started=$(date +%s)
          version="$(scripts/osm-import/import.sh "$RUNNER_TEMP/italy.osm.pbf" public/data | tail -1)"
          [[ "$version" =~ ^[0-9]{8}$ ]] || { echo "Bad DATA_VERSION: '$version'"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "DATA_VERSION=$version · import took $(( $(date +%s) - started )) s"
      - run: npm run build
        env:
          CLOUDFLARE_ENV: staging
          VITE_DATA_VERSION: ${{ steps.import.outputs.version }}
      # Migrations reach staging before the code that needs them (SPEC 16); only CI runs this.
      - name: D1 migrations (staging)
        run: npx wrangler d1 migrations apply DB --remote --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        id: deploy
        run: |
          set -o pipefail # default `bash -e` has no pipefail: a failed deploy must fail here
          npx wrangler deploy --var "DATA_VERSION:$DATA_VERSION" 2>&1 | tee deploy.log
          url="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          DATA_VERSION: ${{ steps.import.outputs.version }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
          DATA_VERSION: ${{ steps.import.outputs.version }}
        run: |
          # The new version takes a few seconds to answer everywhere, and data_version is the OSM import date:
          # it does not change on a code-only deploy, so it cannot tell the new version from the old one
          # (run 410 of 26/11/2026 failed once, one second after the deploy, and passed on the retry).
          # So the whole set of checks is retried, 6 times 15 s apart; a check that is really broken
          # still fails the step. `&&` chains, not separate lines: `bash -e` does not stop inside a
          # function called from an `if`, and the step would never go red.
          smoke() {
            set -x # the last command traced is the check that failed
            # Capture first, then match: curl | grep -q can fail with EPIPE under pipefail.
            health="$(curl -fsS "$URL/api/health")" &&
              grep -q '"status":"ok"' <<<"$health" &&
              grep -q "\"data_version\":\"$DATA_VERSION\"" <<<"$health" &&
              curl -fsS -o /dev/null "$URL/" &&
              shell_headers="$(curl -fsSI "$URL/")" &&
              grep -qi '^content-security-policy:' <<<"$shell_headers" &&
              api_headers="$(curl -fsSI "$URL/api/health")" &&
              grep -qi '^strict-transport-security:' <<<"$api_headers" &&
              cell_headers="$(curl -fsSI "$URL/data/$DATA_VERSION/v/u0nd9.json")" &&
              grep -qi '^content-type: application/json' <<<"$cell_headers" && # not the SPA fallback
              grep -qi '^cache-control: public, max-age=31536000, immutable' <<<"$cell_headers" &&
              curl -fsS -o /dev/null "$URL/api/prices/u0nd9"
          }
          for attempt in 1 2 3 4 5 6; do
            if smoke; then
              set +x
              echo "Smoke test passed (attempt $attempt of 6)"
              exit 0
            fi
            set +x
            echo "Smoke test attempt $attempt of 6 failed"
            [ "$attempt" -lt 6 ] && sleep 15
          done
          echo "Smoke test failed after 6 attempts"
          exit 1
