# Deploy to staging after a green CI run on main (SPEC 16). Production: tag v0.x.y, from M6.
name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    # Only CI runs triggered by a push to main of this repository (never forks or PRs).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The OSM import (M1-03) will run here and set DATA_VERSION; until then "none".
      - run: npm run build
        env:
          CLOUDFLARE_ENV: staging
      - name: Deploy
        id: deploy
        run: |
          set -o pipefail # default `bash -e` has no pipefail: a failed deploy must fail here
          npx wrangler deploy 2>&1 | tee deploy.log
          url="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for i in $(seq 1 20); do curl -fsS "$URL/api/health" && break; sleep 3; done
          echo
          # Capture first, then match: curl | grep -q can fail with EPIPE under pipefail.
          health="$(curl -fsS "$URL/api/health")"
          grep -q '"status":"ok"' <<<"$health"
          curl -fsS -o /dev/null -w "shell: HTTP %{http_code}\n" "$URL/"
          shell_headers="$(curl -fsSI "$URL/")"
          grep -qi '^content-security-policy:' <<<"$shell_headers"
          api_headers="$(curl -fsSI "$URL/api/health")"
          grep -qi '^strict-transport-security:' <<<"$api_headers"
