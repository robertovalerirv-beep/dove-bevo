name: Mobile apps

on:
  push:
    tags:
      - "mobile-release/v*"
  pull_request:
    paths:
      - "mobile-apps/**"
      - ".github/workflows/mobile-apps.yml"

permissions:
  contents: read

concurrency:
  group: mobile-apps-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  android:
    name: Android production app build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/mobile-apps/android/.gradle-user-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Build APK and unsigned release bundle, run tests and lint
        working-directory: mobile-apps/android
        run: bash gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:bundleRelease
      - name: Check signing input and cleanup boundaries without credentials
        run: python3 -B mobile-apps/android/tests/release_android_test.py -v
      - name: Install official emulator image
        timeout-minutes: 8
        run: sdkmanager "emulator" "platform-tools" "system-images;android-36;google_apis;x86_64"
      - name: Allow this temporary runner user to use KVM
        run: |
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -u):rw" /dev/kvm
      - name: Launch and test live application
        timeout-minutes: 8
        run: python3 mobile-apps/scripts/android-smoke.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dove-bevo-android
          path: |
            mobile-apps/android/app/build/outputs/apk/debug/*.apk
            mobile-apps/android/app/build/outputs/bundle/release/*.aab
            mobile-apps/android/app/build/reports/
            mobile-apps/evidence/android/
          retention-days: 7
          if-no-files-found: error

  release-android:
    name: Sign Android release bundle
    needs: [android, ios]
    if: >-
      github.event_name == 'push' && github.ref_type == 'tag' &&
      startsWith(github.ref, 'refs/tags/mobile-release/v') &&
      github.repository == 'robertovalerirv-beep/dove-bevo'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Sign and verify release bundle
        env:
          DOVEBEVO_ANDROID_KEYSTORE_BASE64: ${{ secrets.DOVEBEVO_ANDROID_KEYSTORE_BASE64 }}
          DOVEBEVO_SIGNING_PASSWORD: ${{ secrets.DOVEBEVO_SIGNING_PASSWORD }}
          DOVEBEVO_ANDROID_CERT_SHA256: ${{ secrets.DOVEBEVO_ANDROID_CERT_SHA256 }}
          DOVEBEVO_BUILD_NUMBER: ${{ github.run_number }}
          GRADLE_USER_HOME: ${{ github.workspace }}/mobile-apps/android/.gradle-user-home
        run: bash mobile-apps/scripts/release-android.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dove-bevo-android-release-${{ github.sha }}
          path: mobile-apps/android/app/build/outputs/bundle/release/*.aab
          retention-days: 14
          if-no-files-found: error

  release-ios:
    name: Sign and upload iOS release
    needs: [android, ios]
    if: >-
      github.event_name == 'push' && github.ref_type == 'tag' &&
      startsWith(github.ref, 'refs/tags/mobile-release/v') &&
      github.repository == 'robertovalerirv-beep/dove-bevo'
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Generate pinned native Xcode project
        run: bash mobile-apps/ios/scripts/generate-project.sh
      - name: Sign, verify and upload App Store build
        env:
          DOVEBEVO_IOS_CERTIFICATE_BASE64: ${{ secrets.DOVEBEVO_IOS_CERTIFICATE_BASE64 }}
          DOVEBEVO_SIGNING_PASSWORD: ${{ secrets.DOVEBEVO_SIGNING_PASSWORD }}
          DOVEBEVO_IOS_PROFILE_BASE64: ${{ secrets.DOVEBEVO_IOS_PROFILE_BASE64 }}
          DOVEBEVO_ASC_PRIVATE_KEY: ${{ secrets.DOVEBEVO_ASC_PRIVATE_KEY }}
          DOVEBEVO_ASC_KEY_ID: ${{ secrets.DOVEBEVO_ASC_KEY_ID }}
          DOVEBEVO_ASC_ISSUER_ID: ${{ secrets.DOVEBEVO_ASC_ISSUER_ID }}
          DOVEBEVO_BUILD_NUMBER: ${{ github.run_number }}
        run: bash mobile-apps/ios/scripts/release-ios.sh --upload
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dove-bevo-ios-release-${{ github.sha }}
          path: |
            mobile-apps/ios/.build/release/export/*.ipa
            mobile-apps/ios/.build/release/release-manifest.json
          retention-days: 14
          if-no-files-found: error

  ios:
    name: iOS simulator tests and unsigned device archive
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Retain installed Apple upload tool capabilities
        run: |
          mkdir -p mobile-apps/ios/.build/SimulatorDiagnostics
          if ! xcrun altool --help > mobile-apps/ios/.build/SimulatorDiagnostics/altool-help.txt 2>&1; then
            printf 'Apple upload tool help returned a nonzero status; diagnostics retained.\n'
          fi
      - name: Generate pinned native Xcode project
        run: bash mobile-apps/ios/scripts/generate-project.sh
      - name: Check simulator selection and release metadata guards
        run: python3 -B -m unittest discover -s mobile-apps/ios/scripts/tests -p 'test_*.py' -v
      - name: Build simulator app
        run: bash mobile-apps/ios/scripts/build-simulator.sh
      - name: Run unit and live application tests
        timeout-minutes: 10
        run: bash mobile-apps/ios/scripts/test-simulator.sh
      - name: Compile unsigned device archive
        run: bash mobile-apps/ios/scripts/archive-unsigned.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dove-bevo-ios
          path: |
            mobile-apps/ios/.build/DoveBevo.xcarchive
            mobile-apps/ios/.build/TestResults.xcresult
            mobile-apps/ios/.build/Screenshots/
            mobile-apps/ios/.build/SimulatorDiagnostics/
            mobile-apps/ios/.build/DerivedData/Build/Products/Debug-iphonesimulator/*.app
          retention-days: 7
          if-no-files-found: error
