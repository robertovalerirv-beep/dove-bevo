name: Audit exact Dove Bevo TestFlight distribution

on:
  push:
    tags:
      - "mobile-beta-distribution-audit/20261102-v4"

permissions:
  contents: read

jobs:
  audit-beta:
    if: >-
      github.repository == 'robertovalerirv-beep/dove-bevo' &&
      github.event_name == 'push' &&
      github.ref == 'refs/tags/mobile-beta-distribution-audit/20261102-v4'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify exact-build, read-only and guarded-write boundaries offline
        run: node --test scripts/tests/mobile-store-status.test.mjs scripts/tests/mobile-beta-distribution.test.mjs
      - name: Audit build 62 and its two existing test groups
        run: node scripts/mobile-beta-distribution.mjs "$OUTPUT_PATH" --plan-output "$PLAN_PATH"
        env:
          OUTPUT_PATH: ${{ runner.temp }}/dove-bevo-beta-62-audit.json
          PLAN_PATH: ${{ runner.temp }}/dove-bevo-beta-62-plan.json
          DOVEBEVO_ASC_PRIVATE_KEY: ${{ secrets.DOVEBEVO_ASC_PRIVATE_KEY }}
          DOVEBEVO_ASC_KEY_ID: ${{ secrets.DOVEBEVO_ASC_KEY_ID }}
          DOVEBEVO_ASC_ISSUER_ID: ${{ secrets.DOVEBEVO_ASC_ISSUER_ID }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dove-bevo-beta-62-audit
          path: |
            ${{ runner.temp }}/dove-bevo-beta-62-audit.json
            ${{ runner.temp }}/dove-bevo-beta-62-plan.json
          if-no-files-found: warn
          retention-days: 14
