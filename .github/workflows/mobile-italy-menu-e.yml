name: Reviewed Italy menu batch E
on:
  pull_request:
    paths:
      - "mobile-apps/tools/menu-seed/**"
      - "mobile-apps/data/italy-menu-seed-20261102-e.json"
      - ".github/workflows/mobile-italy-menu-e.yml"
  push:
    tags:
      - "mobile-italy-menu-e-audit/20261102-v3"
      - "mobile-italy-menu-e-seed/20261102-v3"
permissions:
  contents: read
concurrency:
  group: dovebevo-one-off-menu-import
  cancel-in-progress: false
env:
  MANIFEST: mobile-apps/data/italy-menu-seed-20261102-e.json
  MANIFEST_SHA256: 6f604cb3cd35d2bb9281be7fbff5796adab8db58933ebea3e9a11c1f6faaaa7d
  TRACER_SHA256: b23ec078472eafc8f0e0c5bf70b840a69e137a5cba06dd328d52478c46dddbd5
  IMPORTER_SHA256: a6ee8ea2f8277584beb83f22baae7787448b83db417fa80716b61e8f431fad78
jobs:
  preservation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify immutable source, manifest and all preservation cases
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$MANIFEST_SHA256" "$MANIFEST" | sha256sum --check --strict
          printf '%s  %s\n' "$IMPORTER_SHA256" mobile-apps/tools/menu-seed/live_import.py | sha256sum --check --strict
          printf '%s  %s\n' "$TRACER_SHA256" mobile-apps/tools/menu-seed/run_import_with_diagnostics.py | sha256sum --check --strict
          python3 -B -m unittest discover -s mobile-apps/tools/menu-seed -p 'test_live_import.py' -v
          python3 -B -m unittest discover -s mobile-apps/tools/menu-seed -p 'test_no_google.py' -v
          python3 -B -m unittest discover -s mobile-apps/tools/menu-seed -p 'test_batch_e.py' -v
          python3 -B -m unittest discover -s mobile-apps/tools/menu-seed -p 'test_menu_discovery.py' -v
          python3 -B -m unittest discover -s mobile-apps/tools/menu-seed -p 'test_import_diagnostics.py' -v
  reviewed-import:
    needs: preservation
    if: >-
      github.repository == 'robertovalerirv-beep/dove-bevo' &&
      github.event_name == 'push' && github.ref_type == 'tag' &&
      (github.ref == 'refs/tags/mobile-italy-menu-e-audit/20261102-v3' ||
      github.ref == 'refs/tags/mobile-italy-menu-e-seed/20261102-v3')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify source and manifest again before protected access
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$MANIFEST_SHA256" "$MANIFEST" | sha256sum --check --strict
          printf '%s  %s\n' "$IMPORTER_SHA256" mobile-apps/tools/menu-seed/live_import.py | sha256sum --check --strict
          printf '%s  %s\n' "$TRACER_SHA256" mobile-apps/tools/menu-seed/run_import_with_diagnostics.py | sha256sum --check --strict
      - name: Audit or apply only this exact reviewed cohort
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RECEIPT: ${{ runner.temp }}/italy-menu-e/receipt-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/mobile-italy-menu-e-audit/20261102-v3) mode_args=(); expected=dry_run ;;
            refs/tags/mobile-italy-menu-e-seed/20261102-v3) mode_args=(--apply --approved-sha256 "$MANIFEST_SHA256"); expected=apply ;;
            *) exit 2 ;;
          esac
          mkdir -p "$(dirname "$RECEIPT")"
          python3 -I -S -B mobile-apps/tools/menu-seed/run_import_with_diagnostics.py --manifest "$MANIFEST" --receipt "$RECEIPT" "${mode_args[@]}"
          python3 -B - "$expected" <<'PY'
          import json, os, sys
          from pathlib import Path
          receipt=json.loads(Path(os.environ["RECEIPT"]).read_text(encoding="utf-8"))
          assert receipt["complete"] is True and receipt["mode"] == sys.argv[1]
          assert receipt["manifest_sha256"] == os.environ["MANIFEST_SHA256"]
          assert receipt["batch_id"] == "italy-major-cities-20261102-e"
          assert len(receipt["records"]) == 21 and not receipt["errors"]
          PY
      - name: Public read-back of newly inserted rows
        if: github.ref == 'refs/tags/mobile-italy-menu-e-seed/20261102-v3'
        shell: bash
        run: |
          python3 -B mobile-apps/tools/menu-seed/verify_batch_d.py --manifest "$MANIFEST" --receipt "${{ runner.temp }}/italy-menu-e/receipt-${{ github.run_id }}-${{ github.run_attempt }}.json" --output "${{ runner.temp }}/italy-menu-e/public-readback.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: italy-menu-e-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/italy-menu-e/*.json*
          retention-days: 30
          if-no-files-found: warn
