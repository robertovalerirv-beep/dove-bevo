name: One-off reviewed menu batch

on:
  push:
    tags:
      - "mobile-menu-audit/v*"
      - "mobile-menu-seed/v*"

permissions:
  contents: read

concurrency:
  group: dovebevo-one-off-menu-import
  cancel-in-progress: false

jobs:
  reviewed-batch:
    if: github.repository == 'robertovalerirv-beep/dove-bevo' && github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MANIFEST: mobile-apps/data/menu-seed-existing-20261101-b.json
      MANIFEST_SHA256: 07fc73fdb9b40d35126868ca8bd1bc96528609cfaad8157df83c5af934c95077
      RECEIPT: mobile-apps/evidence/menu-import/receipt.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the exact reviewed batch and local preservation tests
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$MANIFEST_SHA256" "$MANIFEST" | sha256sum --check --strict
          python3 -B -m unittest discover -s mobile-apps/tools/menu-seed -p 'test_live_import.py' -v
          mkdir -p "$(dirname "$RECEIPT")"
      - name: Read-only audit or explicitly tagged guarded import
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/mobile-menu-audit/v*) mode_args=() ;;
            refs/tags/mobile-menu-seed/v*) mode_args=(--apply --approved-sha256 "$MANIFEST_SHA256") ;;
            *) exit 2 ;;
          esac
          python3 -B mobile-apps/tools/menu-seed/live_import.py --manifest "$MANIFEST" --receipt "$RECEIPT" "${mode_args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: menu-batch-receipt-${{ github.run_id }}
          path: mobile-apps/evidence/menu-import/receipt.json
          retention-days: 30
          if-no-files-found: warn
