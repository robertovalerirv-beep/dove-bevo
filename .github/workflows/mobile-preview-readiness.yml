# Readiness evidence only. Read success does not establish provisioning permissions.
name: Mobile preview readiness

on:
  push:
    branches: [codex/mobile-launch-20261026]
    paths:
      - ".github/workflows/mobile-preview-readiness.yml"
      - "scripts/mobile-preview-preflight.mjs"
      - "tests/unit/mobile-preview-preflight.test.ts"

permissions:
  contents: read

concurrency:
  group: mobile-preview-readiness
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Verify the read-only check
        run: npx vitest run --project unit tests/unit/mobile-preview-preflight.test.ts
      - name: Read Cloudflare readiness
        run: node scripts/mobile-preview-preflight.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
