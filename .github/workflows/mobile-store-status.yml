name: Read-only Apple release status

on:
  push:
    tags:
      - "mobile-store-status/20261102-v1"

permissions:
  contents: read

jobs:
  apple-status:
    if: >-
      github.repository == 'robertovalerirv-beep/dove-bevo' &&
      github.event_name == 'push' &&
      github.ref == 'refs/tags/mobile-store-status/20261102-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify read-only credential and output boundaries
        run: node --test scripts/tests/mobile-store-status.test.mjs
      - name: Read Apple version and beta decisions
        run: node scripts/mobile-store-status.mjs "$RUNNER_TEMP/apple-release-status.json"
        env:
          DOVEBEVO_ASC_PRIVATE_KEY: ${{ secrets.DOVEBEVO_ASC_PRIVATE_KEY }}
          DOVEBEVO_ASC_KEY_ID: ${{ secrets.DOVEBEVO_ASC_KEY_ID }}
          DOVEBEVO_ASC_ISSUER_ID: ${{ secrets.DOVEBEVO_ASC_ISSUER_ID }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: apple-release-status
          path: ${{ runner.temp }}/apple-release-status.json
          if-no-files-found: warn
          retention-days: 14
