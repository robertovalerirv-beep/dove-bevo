title = "Dove Bevo secret scanning"

[extend]
useDefault = true

# The m-key is a public SHA-derived venue identifier, not a credential.
# Historical manifest paths remain in the PR commit range and must be exact.
# Gitleaks 8.24.3 reads the singular global allowlist; AND keeps scope to one public value.
[allowlist]
description = "Dambo public owner venue identifier in pinned manifests"
condition = "AND"
regexTarget = "secret"
paths = [
  '''^mobile-apps/data/mobile-menu-v2-seeds/351634d027e740a1f8840697fb58187e1b4aa3ef6d09f8bf7e2badfc6bd163c5\.json$''',
  '''^mobile-apps/data/mobile-menu-v2-seeds/c0fb0a3789aaa10bf0d8090c9448201e1d93a7cc606151fc2dbbdc4c6a8b220a\.json$''',
  '''^mobile-apps/data/mobile-menu-v2-seeds/820ad99547035db65d951401cc4a87d6db319488febaeb3df0e54f51571dd4a8\.json$'''
]
regexes = ['''^m4900240db731f0b53e2b7bf6$''']

# Exact public identifier exception for La Zanzara owner venue manifest.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "La Zanzara public owner venue identifier"
condition = "AND"
regexTarget = "secret"
paths = ['''^mobile-apps/data/mobile-menu-v2-seeds/e6275baccc29ad8ef4ca7a3c7aa20d8717e2eb3549c22105ab0ce9975e69fc49\.json$''']
regexes = ['''^mbbd4a28a10bfcb50c6d9daef$''']

# Exact public identifier exception for the Sa Panada owner venue manifest.
[[rules.allowlists]]
description = "Sa Panada public owner venue identifier"
condition = "AND"
regexTarget = "secret"
paths = ['''^mobile-apps/data/mobile-menu-v2-seeds/e6f7a4f76eeee6e178fb7621d61277d615540d7c7b218a889efb33ce51890d5d\.json$''']
regexes = ['''^m1354096fc013d6e5d045b2ed$''']
# Exact public owner venue identifier for CasaCinema Napoli source manifest.
[[rules.allowlists]]
description = "CasaCinema Napoli public owner venue identifier"
condition = "AND"
regexTarget = "secret"
paths = ['''^mobile-apps/data/mobile-menu-v2-seeds/4b0aded8401c012cc8d02fb5961dc36cc65c8bcb1fc81b8f0e530a98e339d2c4\.json$''']
regexes = ['''^m31771b8f0063bacd3dfb2f37$''']
