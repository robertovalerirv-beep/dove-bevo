import javax.inject.Inject
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.file.FileSystemOperations
import org.gradle.api.file.RegularFileProperty

plugins { id 'com.android.application' }

abstract class GeneratePrivacyAssets extends DefaultTask {
    @InputFile @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getPolicyFile()
    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()
    @Inject
    abstract FileSystemOperations getFileSystemOperations()

    @TaskAction
    void generate() {
        File policy = policyFile.get().asFile
        if (!policy.isFile() || policy.length() == 0 || policy.length() > 131072)
            throw new GradleException('The common mobile privacy policy is missing, empty or too large.')
        // Copy exactly this document; never expose the parent source directory as app assets.
        fileSystemOperations.sync {
            from(policy)
            into(outputDirectory)
        }
    }
}

android {
    namespace = 'com.dovebevo.app'
    compileSdk = 37
    buildToolsVersion = '36.0.0'
    defaultConfig {
        applicationId = 'com.dovebevo.app'
        minSdk = 24
        targetSdk = 36
        versionCode = 1
        versionName = '1.0.0'
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled = false
            // Signing is supplied by the secure release environment, never by source.
            signingConfig = null
        }
    }
    lint { abortOnError = true; checkReleaseBuilds = true }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def generatePrivacyAssets = tasks.register("generate${variant.name.capitalize()}PrivacyAssets", GeneratePrivacyAssets) {
            policyFile.set(layout.projectDirectory.file('../../privacy.md'))
            outputDirectory.set(layout.buildDirectory.dir("generated/privacyAssets/${variant.name}"))
        }
        variant.sources.assets.addGeneratedSourceDirectory(generatePrivacyAssets) { it.outputDirectory }
        tasks.named('preBuild').configure { dependsOn(generatePrivacyAssets) }
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.11.0'
    testImplementation 'junit:junit:4.13.2'
}
